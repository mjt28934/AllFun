name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history so release notes can list commits since the previous tag.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found. Set ANDROID_HOME or install the SDK."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "Using $SDKM with SDK $SDK"

          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"
          echo "Installed SDK packages:"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Set up Gradle with dependency caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Compute version from the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not semantic versioning (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if [ "$CODE" -gt 2100000000 ]; then
            echo "::error::Version code $CODE does not fit in an Android versionCode."
            exit 1
          fi
          echo "name=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "apk=app/build/outputs/apk/release/AllFun-$MAJOR.$MINOR.$PATCH-release.apk" >> "$GITHUB_OUTPUT"

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISSING=0
          for NAME in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!NAME}" ]; then
              echo "::error::Repository secret $NAME is not set. See README → Signing."
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi

          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/allfun-release.jks
          printf 'storeFile=keystore/allfun-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          echo "Keystore restored (contents not printed)."

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build and sign the release APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Verify the APK
        run: |
          set -euo pipefail
          APK="${{ steps.version.outputs.apk }}"
          VERSION="${{ steps.version.outputs.name }}"
          CODE="${{ steps.version.outputs.code }}"

          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK was not produced at $APK"
            exit 1
          fi

          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          BADGING="$("$AAPT2" dump badging "$APK" | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='app.allfun'" \
            || { echo "::error::APK package name is not app.allfun"; exit 1; }
          echo "$BADGING" | grep -q "versionName='$VERSION'" \
            || { echo "::error::APK versionName does not match tag $VERSION"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='$CODE'" \
            || { echo "::error::APK versionCode is not $CODE"; exit 1; }

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -q "Verified using v2 scheme" apksigner.txt \
            || { echo "::error::APK has no v2 signature"; exit 1; }
          if grep -q "CN=Android Debug" apksigner.txt; then
            echo "::error::APK is signed with the debug key, not the release keystore."
            exit 1
          fi

          SIZE="$(stat -c %s "$APK")"
          echo "APK verified: $APK ($SIZE bytes, signed, package app.allfun, $VERSION/$CODE)"

      - name: Write SHA-256 checksum
        run: |
          set -euo pipefail
          APK="${{ steps.version.outputs.apk }}"
          cd "$(dirname "$APK")"
          sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256"
          cat "$(basename "$APK").sha256"

      - name: Prepare release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.name }}"

          if [ -f "docs/releases/$TAG.md" ]; then
            echo "Using curated notes from docs/releases/$TAG.md"
            cp "docs/releases/$TAG.md" release-notes.md
          else
            PREVIOUS="$(git tag --sort=-v:refname | grep -v "^$TAG$" | head -1 || true)"
            {
              echo "## AllFun $VERSION"
              echo
              echo "Signed release build for \`$TAG\`."
              echo
              if [ -n "$PREVIOUS" ]; then
                echo "Changes since $PREVIOUS:"
                echo
                git log --no-merges --pretty='- %s' "$PREVIOUS..HEAD"
              else
                echo "Changes:"
                echo
                git log --no-merges --pretty='- %s'
              fi
            } > release-notes.md
          fi

          {
            echo
            echo "---"
            echo
            echo "### Install"
            echo
            echo "1. Download \`AllFun-$VERSION-release.apk\` below."
            echo "2. Confirm the SHA-256 against \`AllFun-$VERSION-release.apk.sha256\`."
            echo "3. Open the file and let Android install it over the existing AllFun app."
            echo
            echo "Existing installations of AllFun (signed with the same release key) update"
            echo "in place, and library data is preserved. From inside the app, use"
            echo "**Settings → About → App Updates**."
          } >> release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.name }}"
          APK="${{ steps.version.outputs.apk }}"

          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            echo "Removing an earlier draft for $TAG so this run starts clean."
            gh release delete "$TAG" --yes
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG is already published. Bump the version instead of reusing a tag."
            exit 1
          fi

          gh release create "$TAG" \
            --draft \
            --title "AllFun $VERSION" \
            --notes-file release-notes.md
          gh release upload "$TAG" "$APK" "$APK.sha256" --clobber

      - name: Verify the draft before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK="${{ steps.version.outputs.apk }}"

          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$ASSETS"
          echo "$ASSETS" | grep -qx "$(basename "$APK")" \
            || { echo "::error::The APK asset is missing from the draft release."; exit 1; }
          echo "$ASSETS" | grep -qx "$(basename "$APK").sha256" \
            || { echo "::error::The checksum asset is missing from the draft release."; exit 1; }

          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "::error::Release is not a draft; refusing to continue."
            exit 1
          fi

          # Download the published checksum and compare it with the APK we just built.
          mkdir -p verify
          gh release download "$TAG" --pattern "*.sha256" --dir verify
          LOCAL="$(sha256sum "$APK" | cut -d' ' -f1)"
          REMOTE="$(cut -d' ' -f1 < "verify/$(basename "$APK").sha256")"
          echo "local  $LOCAL"
          echo "remote $REMOTE"
          [ "$LOCAL" = "$REMOTE" ] \
            || { echo "::error::The checksum asset does not match the built APK."; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" --draft=false --latest

      - name: Confirm the published release is the latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          LATEST="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
          echo "latest release: $LATEST"
          [ "$LATEST" = "$TAG" ] \
            || { echo "::error::GitHub reports $LATEST as latest, not $TAG."; exit 1; }
          gh release view "$TAG" --json url,assets \
            --jq '.url, (.assets[] | "\(.name) \(.size) bytes")'

      - name: Upload the signed APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllFun-${{ steps.version.outputs.name }}-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Report failure
        if: failure()
        run: |
          {
            echo "## Release failed"
            echo ""
            echo "- Tag: \`${{ github.ref_name }}\`"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Nothing was published. If a draft release exists it stays a draft and is"
            echo "replaced by the next successful run of this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
